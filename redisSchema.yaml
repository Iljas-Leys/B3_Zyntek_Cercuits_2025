version: '0.1.0'

index:
    name: rag-index
    prefix: doc

fields:
    - name: content
      type: text
    - name: doc_id
      type: tag
      attrs:
        separator: ","
    - name: chunk_id
      type: tag
      attrs:
        separator: ","
    - name: source
      type: text
    - name: title
      type: text
    - name: file_type
      type: tag
      attrs:
        separator: ","
    - name: start_char
      type: numeric
    - name: end_char
      type: numeric
    - name: content_embedding
      type: vector
      attrs:
        algorithm: flat
        dims: 384
        distance_metric: cosine
        datatype: float32